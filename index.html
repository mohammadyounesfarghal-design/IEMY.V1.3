<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IEMY — Buy and sell anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0A1730; --navy-800:#122544; --navy-700:#1C3868;
    --gold-500:#C9962F; --gold-400:#DDB255; --gold-100:#F6E8C8;
    --silver-300:#C9CED3;
    --bg:#F2F4F8; --card:#FFFFFF; --ink:#152238; --ink-soft:#4C5768; --muted:#828B9B;
    --border:#E2E6ED; --alert:#B23B3B; --alert-tint:#F6E3E1; --success-tint:#E4F0E7;
    --shadow:0 1px 0 rgba(10,23,48,.05);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1220; --card:#121B2E; --ink:#EDF0F5; --ink-soft:#B7C0CF; --muted:#7C8698;
      --border:#233150; --navy-900:#070E1D; --navy-800:#0E1B33; --alert-tint:#33201D; --success-tint:#16281C;
      --shadow:0 1px 0 rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1220; --card:#121B2E; --ink:#EDF0F5; --ink-soft:#B7C0CF; --muted:#7C8698;
    --border:#233150; --navy-900:#070E1D; --navy-800:#0E1B33; --alert-tint:#33201D; --success-tint:#16281C;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  [dir="rtl"] body{font-family:'Inter','Tahoma',sans-serif;}
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif; font-weight:700; letter-spacing:-0.01em; margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-100); color:var(--navy-900);}
  :focus-visible{outline:2px solid var(--gold-500); outline-offset:2px;}
  .wrap{max-width:1200px; margin:0 auto; padding-inline:20px;}
  img{max-width:100%;}

  /* ===== header ===== */
  header{position:sticky; top:0; z-index:40; padding-top:env(safe-area-inset-top,0px); background:var(--navy-900);}
  .topbar{
    display:flex; align-items:center; gap:16px; padding:12px 20px; max-width:1200px; margin:0 auto;
  }
  .logo{display:flex; align-items:center; gap:0; flex-shrink:0; cursor:pointer; background:none; border:none; padding:0;}
  .logo img{height:42px; width:auto; display:block; border-radius:4px;}
  .searchbox{
    flex:1; display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:9px 16px; min-width:0;
  }
  .searchbox input{border:none; outline:none; background:none; width:100%; font-size:14px; color:var(--ink); font-family:inherit;}
  .searchbox svg{flex-shrink:0; color:var(--muted);}
  .headbtns{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; border:1px solid transparent;
    cursor:pointer; font-size:14px; font-weight:600; padding:9px 16px; transition:filter .15s, background .15s, border-color .15s; white-space:nowrap;
  }
  .btn-gold{background:linear-gradient(180deg,var(--gold-400),var(--gold-500)); color:#28210A;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-ghost-dark{background:rgba(255,255,255,.06); color:#EDEFF3; border-color:rgba(255,255,255,.18);}
  .btn-ghost-dark:hover{border-color:var(--gold-400);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--gold-500);}
  .btn-danger{background:none; color:var(--alert); border-color:var(--alert-tint);}
  .btn-danger:hover{background:var(--alert-tint);}
  .btn-block{width:100%; padding:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  select.langsel{
    background:rgba(255,255,255,.06); color:#EDEFF3; border:1px solid rgba(255,255,255,.18); border-radius:8px;
    padding:9px 10px; font-size:13px; font-family:inherit; cursor:pointer;
  }
  select.langsel option{color:#000;}

  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--gold-100); color:var(--navy-800);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;
  }
  .user-chip{display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; padding:2px; border-radius:999px;}
  .user-chip span{font-size:13.5px; font-weight:600; color:#EDEFF3; display:none;}
  @media(min-width:640px){ .user-chip span{display:inline;} }

  /* category + city bars */
  .catbar-outer{background:var(--navy-800); border-top:1px solid rgba(255,255,255,.06);}
  .scrollrow{display:flex; gap:8px; overflow-x:auto; padding:10px 20px; max-width:1200px; margin:0 auto; scrollbar-width:none;}
  .scrollrow::-webkit-scrollbar{display:none;}
  .catchip{
    flex-shrink:0; display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04); color:#DDE2EA; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .catchip.active{background:var(--gold-500); border-color:var(--gold-500); color:#221B08;}
  .catchip:hover:not(.active){border-color:var(--gold-400);}
  .citybar-outer{background:var(--bg); border-bottom:1px solid var(--border);}
  .citychip{
    flex-shrink:0; padding:6px 13px; border-radius:999px; border:1px solid var(--border); background:var(--card);
    color:var(--ink-soft); font-size:12.5px; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .citychip.active{background:var(--navy-800); border-color:var(--navy-800); color:#fff;}
  .citychip:hover:not(.active){border-color:var(--navy-800);}

  main{padding-bottom:80px; min-height:60vh;}

  /* hero */
  .hero{background:radial-gradient(circle at 50% 20%,#163b73 0%,var(--navy-900) 55%,#050b18 100%); color:#F1EFE6; position:relative; overflow:hidden;}
  .hero::before{content:""; position:absolute; width:620px; height:620px; border-radius:50%; left:50%; top:-310px; transform:translateX(-50%); background:radial-gradient(circle,rgba(36,115,205,.16),transparent 68%); pointer-events:none;}
  .hero .wrap{padding-block:42px; max-width:1200px; position:relative; z-index:2;}
  .hero-grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(420px,.95fr); align-items:center; gap:42px;}
  @media(max-width:860px){ .hero .wrap{padding-block:28px;} .hero-grid{grid-template-columns:1fr; gap:20px;} .hero-copy{order:2; text-align:center;} .hero-copy .lede{margin-inline:auto;} .hero .cta-row{justify-content:center;} }
  .hero h1{color:#F5F3EA; font-size:clamp(28px,4vw,44px); line-height:1.08;}
  .hero p.lede{color:#C6CEDD; font-size:15.5px; line-height:1.6; max-width:50ch; margin-top:14px;}
  .hero .cta-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}

  /* ===== IEMY spinning GCC globe ===== */
  .iemy-globe-wrap{display:flex; align-items:center; justify-content:center; min-height:420px; perspective:1000px;}
  .iemy-globe{width:min(430px,82vw); aspect-ratio:1; position:relative; border-radius:50%; transform-style:preserve-3d; animation:globeFloat 5s ease-in-out infinite;}
  .iemy-earth{position:absolute; inset:8%; border-radius:50%; overflow:hidden; background:
      radial-gradient(circle at 35% 28%,rgba(255,255,255,.35),transparent 7%),
      radial-gradient(circle at 62% 48%,rgba(255,211,88,.28),transparent 18%),
      radial-gradient(circle at 38% 64%,rgba(24,101,181,.55),transparent 28%),
      radial-gradient(circle at 50% 50%,#123a70 0%,#061a36 62%,#020916 100%);
      box-shadow:0 0 35px rgba(51,157,255,.55), inset -24px -18px 50px rgba(0,0,0,.7), inset 18px 12px 40px rgba(80,180,255,.28);
      border:2px solid rgba(92,190,255,.65);}
  .iemy-earth::before,.iemy-earth::after{content:""; position:absolute; inset:-15%; border-radius:50%; border:1px solid rgba(255,204,80,.28); transform:rotate(28deg) scaleY(.55);}
  .iemy-earth::after{transform:rotate(-28deg) scaleY(.55); border-color:rgba(76,177,255,.25);}
  .globe-land{position:absolute; inset:0; background:
      radial-gradient(ellipse at 61% 40%,rgba(229,178,61,.8) 0 5%,transparent 6%),
      radial-gradient(ellipse at 54% 48%,rgba(229,178,61,.75) 0 4%,transparent 5%),
      radial-gradient(ellipse at 70% 51%,rgba(229,178,61,.65) 0 3%,transparent 4%),
      radial-gradient(ellipse at 49% 57%,rgba(229,178,61,.72) 0 3%,transparent 4%),
      radial-gradient(ellipse at 36% 35%,rgba(229,178,61,.48) 0 5%,transparent 6%);
      opacity:.9; filter:blur(.2px); animation:landDrift 10s linear infinite;}
  .globe-logo{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:4; transform:translateZ(45px);}
  .globe-logo span{font-family:'Fraunces',Georgia,serif; font-weight:800; font-size:clamp(60px,9vw,102px); letter-spacing:-.08em; font-style:italic; background:linear-gradient(180deg,#fff5bb 0%,#f6c64d 32%,#b9780f 68%,#fff0a0 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 8px 22px rgba(0,0,0,.65),0 0 18px rgba(255,202,63,.28);}
  .globe-logo::after{content:""; position:absolute; width:62%; height:12px; border-top:5px solid #f1c653; border-radius:50%; transform:rotate(-12deg) translateY(32px); box-shadow:0 3px 7px rgba(0,0,0,.5);}
  .orbit{position:absolute; inset:-8%; border:2px solid rgba(255,202,63,.72); border-radius:50%; transform:rotate(-18deg) scaleY(.48); z-index:5; pointer-events:none; animation:orbitSpin 7s linear infinite;}
  .orbit.orbit2{inset:-16%; border-color:rgba(71,179,255,.5); transform:rotate(62deg) scaleY(.34); animation-duration:11s; animation-direction:reverse;}
  .orbit.orbit3{inset:-25%; border-color:rgba(255,210,92,.28); transform:rotate(25deg) scaleY(.2); animation-duration:15s;}
  .orbit-dot{position:absolute; width:12px; height:12px; border-radius:50%; background:#ffd65c; box-shadow:0 0 15px #ffd65c; top:4%; left:50%; transform:translateX(-50%);}
  .gcc-country{position:absolute; z-index:8; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:800; color:#fff; text-shadow:0 2px 5px #000; animation:countryFloat 4s ease-in-out infinite;}
  .gcc-country b{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:#08162c; border:2px solid #f2c34c; box-shadow:0 0 12px rgba(255,204,77,.35); font-size:22px;}
  .gcc-sa{top:-2%; left:7%;}.gcc-kw{top:23%; left:-9%; animation-delay:-.6s}.gcc-bh{bottom:17%; left:-7%; animation-delay:-1.2s}.gcc-qa{bottom:-3%; left:18%; animation-delay:-1.8s}.gcc-ae{top:8%; right:-8%; animation-delay:-2.4s}.gcc-om{bottom:10%; right:-7%; animation-delay:-3s}
  @keyframes orbitSpin{from{rotate:0deg}to{rotate:360deg}}
  @keyframes globeFloat{0%,100%{transform:translateY(0) rotateX(0deg)}50%{transform:translateY(-8px) rotateX(2deg)}}
  @keyframes landDrift{from{transform:translateX(-3%)}50%{transform:translateX(3%)}to{transform:translateX(-3%)}}
  @keyframes countryFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media(prefers-reduced-motion:reduce){.iemy-globe,.globe-land,.orbit,.gcc-country{animation:none!important;}}

  .wordmark{font-family:'Fraunces',Georgia,serif; font-weight:700; letter-spacing:-0.01em; color:var(--gold-400); line-height:1;}
  .logo .wordmark{font-size:26px; color:var(--gold-400);}
  .auth-wordmark{font-size:34px; color:var(--gold-400); margin-bottom:10px;}
  .footer-wordmark{font-size:18px; color:var(--navy-800); margin-bottom:6px;}
  :root[data-theme="dark"] .footer-wordmark, @media (prefers-color-scheme:dark){ .footer-wordmark{color:var(--gold-400);} }

  /* premium strip */
  .premium-strip-outer{background:var(--gold-100); border-bottom:1px solid var(--gold-400);}
  :root[data-theme="dark"] .premium-strip-outer{background:#241D0C;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .premium-strip-outer{background:#241D0C;} }
  .premium-head{display:flex; align-items:center; gap:8px; padding:14px 20px 0; max-width:1200px; margin:0 auto; color:var(--navy-900); font-weight:700; font-size:14px;}
  :root[data-theme="dark"] .premium-head, @media (prefers-color-scheme:dark){ .premium-head{color:var(--gold-400);} }
  .pstrip{display:flex; gap:12px; overflow-x:auto; padding:12px 20px 16px; max-width:1200px; margin:0 auto; scrollbar-width:none;}
  .pstrip::-webkit-scrollbar{display:none;}
  .pcard{
    flex-shrink:0; width:180px; background:var(--card); border:1.5px solid var(--gold-500); border-radius:10px; overflow:hidden; cursor:pointer;
  }
  .pcard .thumb{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff; position:relative;}
  .pcard .thumb img{width:100%; height:100%; object-fit:cover;}
  .pcard .badge{position:absolute; top:6px; inset-inline-start:6px; background:var(--gold-500); color:#241D0C; font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:4px; letter-spacing:.02em;}
  .pcard .body{padding:9px 10px 11px;}
  .pcard .price{font-weight:800; font-size:14.5px; color:var(--navy-800);}
  :root[data-theme="dark"] .pcard .price{color:var(--gold-400);}
  .pcard .title{font-size:12px; margin-top:3px; color:var(--ink); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  /* feed section */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; padding:20px 0 10px; gap:12px; flex-wrap:wrap;}
  .section-head h2{font-size:20px;}
  .section-head .count{font-size:12.5px; color:var(--muted);}
  select.sortsel{border:1px solid var(--border); background:var(--card); border-radius:6px; padding:7px 10px; font-size:12.5px; color:var(--ink-soft); font-family:inherit;}

  .feed{display:flex; flex-direction:column; gap:8px;}
  .row{
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:10px 14px; cursor:pointer; transition:border-color .15s;
  }
  .row:hover{border-color:var(--navy-800);}
  .row .thumb{
    width:58px; height:58px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; overflow:hidden; position:relative;
  }
  .row .thumb img{width:100%; height:100%; object-fit:cover;}
  .row .info{flex:1; min-width:0;}
  .row .title{font-size:14px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .row .meta .dot{opacity:.5;}
  .row .price-wrap{flex-shrink:0; text-align:end;}
  .row .price{font-weight:800; font-size:15px; color:var(--navy-800);}
  :root[data-theme="dark"] .row .price{color:var(--gold-400);}
  .sold-pill{font-size:10.5px; font-weight:800; color:var(--alert); background:var(--alert-tint); padding:2px 8px; border-radius:4px;}

  .empty{text-align:center; padding:56px 20px; color:var(--muted); border:1px dashed var(--border); border-radius:8px;}
  .empty .serif{font-size:18px; color:var(--ink-soft); margin-bottom:8px;}

  /* views */
  .view{display:none;}
  .view.active{display:block;}

  /* auth */
  .authshell{max-width:920px; margin:32px auto; display:grid; grid-template-columns:1fr 1.1fr; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card);}
  @media(max-width:760px){ .authshell{grid-template-columns:1fr; margin:0;} }
  .authpanel{background:linear-gradient(160deg,var(--navy-900),var(--navy-800)); color:#F1EFE6; padding:40px 32px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;}
  .authpanel img{width:150px; margin-bottom:14px;}
  .authpanel h2{color:#F5F3EA; font-size:23px;}
  .authpanel p{color:#C6CEDD; font-size:13.5px; line-height:1.6; margin-top:10px;}
  .authform{padding:40px 32px;}
  @media(max-width:760px){ .authform{padding:28px 24px;} .authpanel{padding:28px 24px;} }
  .field{margin-bottom:15px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; background:var(--bg); color:var(--ink); font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:90px;}
  .field .hint{font-size:11.5px; color:var(--muted); margin-top:5px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .formerr{color:var(--alert); font-size:13px; margin-bottom:12px; display:none;}
  .switcher{margin-top:14px; font-size:13.5px; color:var(--ink-soft); text-align:center;}
  .switcher button{background:none; border:none; color:var(--navy-800); font-weight:700; cursor:pointer; padding:0; font-size:inherit; font-family:inherit;}
  :root[data-theme="dark"] .switcher button{color:var(--gold-400);}

  /* sell / post-ad */
  .plan-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px;}
  @media(max-width:480px){ .plan-grid{grid-template-columns:1fr 1fr;} }
  .plancard .ptag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--gold-500); background:var(--gold-100); border-radius:5px; padding:2px 7px; margin-top:6px;}
  .plancard{border:2px solid var(--border); border-radius:10px; padding:18px; cursor:pointer; background:var(--card); transition:border-color .15s;}
  .plancard.selected{border-color:var(--navy-800);}
  .plancard.premium.selected{border-color:var(--gold-500);}
  .plancard .pname{font-size:16px; font-weight:800;}
  .plancard.premium .pname{color:var(--gold-500);}
  .plancard .pprice{font-size:22px; font-weight:800; margin-top:6px;}
  .plancard .pdesc{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .plancard .pcheck{float:inline-end; width:20px; height:20px; border-radius:50%; border:2px solid var(--border); display:inline-block;}
  .plancard.selected .pcheck{border-color:var(--navy-800); background:var(--navy-800);}
  .plancard.premium.selected .pcheck{border-color:var(--gold-500); background:var(--gold-500);}

  .sellgrid{display:grid; grid-template-columns:1.1fr 0.8fr; gap:28px; margin-top:6px;}
  @media(max-width:860px){ .sellgrid{grid-template-columns:1fr;} }
  .panel{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px;}
  .imgpicker{border:1.5px dashed var(--border); border-radius:8px; padding:18px; text-align:center; cursor:pointer; color:var(--muted); font-size:13px; position:relative; overflow:hidden; background:var(--bg);}
  .imgpicker img{max-width:100%; max-height:170px; border-radius:6px;}
  .imgpicker input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .preview-label{font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:700;}

  /* payment modal */
  .paybox{max-width:380px; margin:80px auto; background:var(--card); border-radius:12px; padding:26px; text-align:center;}
  .paybox .amt{font-size:30px; font-weight:800; color:var(--gold-500); margin:14px 0;}

  /* my listings */
  .page-title{padding:26px 0 4px;}
  .page-title h2{font-size:22px;}
  .page-title p{color:var(--muted); font-size:13.5px; margin-top:6px;}
  .mylist-item{display:flex; gap:14px; align-items:center; padding:14px; border:1px solid var(--border); border-radius:8px; background:var(--card); margin-bottom:10px; flex-wrap:wrap;}
  .mylist-item .thumb-sm{width:58px; height:58px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; overflow:hidden;}
  .mylist-item .thumb-sm img{width:100%; height:100%; object-fit:cover;}
  .mylist-item .mi-body{flex:1; min-width:160px;}
  .mylist-item .mi-title{font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mylist-item .mi-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .mi-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .status-pill{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:4px; margin-inline-start:8px;}
  .status-active{background:var(--success-tint); color:#2E7D4F;}
  .status-expiring{background:var(--gold-100); color:#8A6416;}
  .status-expired{background:var(--alert-tint); color:var(--alert);}
  .status-sold{background:var(--border); color:var(--ink-soft);}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(7,14,29,.6); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
  .overlay.active{display:flex;}
  .modal{background:var(--card); border-radius:12px; max-width:760px; width:100%; overflow:hidden; display:grid; grid-template-columns:1fr 1fr;}
  @media(max-width:640px){ .modal{grid-template-columns:1fr;} }
  .modal .mimg{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:60px; color:#fff; position:relative;}
  .modal .mimg img{width:100%; height:100%; object-fit:cover;}
  .modal .mbody{padding:26px; position:relative; display:flex; flex-direction:column;}
  .modal .close{position:absolute; top:14px; inset-inline-end:14px; background:var(--bg); border:1px solid var(--border); border-radius:50%; width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .modal .mprice{font-size:24px; color:var(--navy-800); font-weight:800;}
  :root[data-theme="dark"] .modal .mprice{color:var(--gold-400);}
  .modal .mtitle{margin-top:8px; font-size:18px;}
  .modal .mmeta{font-size:12.5px; color:var(--muted); margin-top:8px;}
  .modal .mdesc{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-top:14px; flex:1;}
  .modal .seller-box{margin-top:16px; padding-top:14px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px;}
  .modal .actions{margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;}
  .contact-reveal{margin-top:12px; padding:10px 12px; background:var(--success-tint); border-radius:6px; font-size:13px; display:none;}

  #toast{
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy-900); color:#F1EFE6; padding:11px 20px; border-radius:8px; font-size:13.5px; font-weight:500;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:200; max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{border-top:1px solid var(--border); padding:24px 0; text-align:center; color:var(--muted); font-size:12px;}
  footer img{height:26px; margin-bottom:8px; opacity:.85;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  /* ================= helpers ================= */
  function timeAgo(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<3600) return Math.max(1,Math.floor(s/60))+"m";
    if(s<86400) return Math.floor(s/3600)+"h";
    return Math.floor(s/86400)+"d";
  }
  function money(n){ return "SAR "+Number(n).toLocaleString(); }
  function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

  function daysLeft(p){ return Math.ceil((p.expiresAt-Date.now())/86400000); }
  function computeStatus(p){
    if(p.status==="sold") return "sold";
    if(p.status==="expired") return "expired";
    var dl=daysLeft(p);
    if(dl<=1) return "expiring";
    return "active";
  }

  /* ================= grid / feed ================= */
  function visibleProducts(){
    return getProducts().filter(function(p){ return p.status==="active"; });

  function matchesFilter(p){
    if(state.filterCategory!=="all" && p.category!==state.filterCategory) return false;
    if(state.filterCity!=="all" && p.city!==state.filterCity) return false;
    var q=state.query.trim().toLowerCase();
    if(q && p.title.toLowerCase().indexOf(q)===-1 && p.description.toLowerCase().indexOf(q)===-1) return false;
    return true;
  }

      var thumbStyle = p.image ? "" : "background:"+CAT_COLOR[p.category]+";";
      card.innerHTML =
        '<div class="thumb" style="'+thumbStyle+'">'+(p.image?'<img src="'+p.image+'" alt="">':CAT_EMOJI[p.category])+'<span class="badge">'+tr("premium_badge")+'</span></div>'+
        '<div class="body"><div class="price">'+money(p.price)+'</div><div class="title">'+escapeHtml(p.title)+'</div></div>';
      card.onclick=function(){openProductModal(p.id);};
      strip.appendChild(card);
    });
  }

  function renderRow(p){
    var row=document.createElement("div"); row.className="row";
    var thumbStyle = p.image ? "" : "background:"+CAT_COLOR[p.category]+";";
    row.innerHTML =
      '<div class="thumb" style="'+thumbStyle+'">'+(p.image?'<img src="'+p.image+'" alt="">':CAT_EMOJI[p.category])+'</div>'+
      '<div class="info">'+
        '<div class="title">'+escapeHtml(p.title)+(isPremium(p)?' ★':'')+'</div>'+
        '<div class="meta"><span>'+tr("city_"+p.city)+'</span><span class="dot">·</span><span>'+tr("condition_"+p.condition)+'</span><span class="dot">·</span><span>'+timeAgo(p.createdAt)+'</span></div>'+
      '</div>'+
      '<div class="price-wrap">'+(p.status==="sold"?'<span class="sold-pill">'+tr("status_sold")+'</span>':'<div class="price">'+money(p.price)+'</div>')+'</div>';
    row.onclick=function(){openProductModal(p.id);};
    return row;
  }

  function renderGrid(){
    var feed=document.getElementById("productFeed");
    var all=getProducts().filter(function(p){ return (p.status==="active" || p.status==="sold") && matchesFilter(p); });
    all.sort(function(a,b){
      if(a.status!==b.status) return a.status==="sold" ? 1 : -1;
      if(state.sort==="low") return a.price-b.price;
      if(state.sort==="high") return b.price-a.price;
      return b.createdAt-a.createdAt;
    });
    feed.innerHTML="";
    all.forEach(function(p){ feed.appendChild(renderRow(p)); });
    document.getElementById("emptyState").style.display = all.length ? "none" : "block";
    document.getElementById("resultCount").textContent = all.length;
    renderPremiumStrip();
  }

  /* ================= product modal ================= */
  function openProductModal(id){
    var p=getProducts().find(function(x){return x.id===id;}); if(!p) return;
    var seller=getUsers().find(function(u){return u.username===p.seller;});
    var isOwner = currentUser() && currentUser().username===p.seller;
    var content=document.getElementById("modalContent");
    var thumbStyle = p.image ? "" : "background:"+CAT_COLOR[p.category];
    content.innerHTML =
      '<div class="mimg" style="'+thumbStyle+'">'+(p.image?'<img src="'+p.image+'" alt="">':CAT_EMOJI[p.category])+'</div>'+
      '<div class="mbody">'+
        '<button class="close" id="modalClose" aria-label="Close">✕</button>'+
        '<div class="mprice">'+money(p.price)+'</div>'+
        '<div class="mtitle serif">'+escapeHtml(p.title)+'</div>'+
        '<div class="mmeta">'+tr("category_"+p.category)+' · '+tr("city_"+p.city)+' · '+tr("condition_"+p.condition)+' · '+timeAgo(p.createdAt)+
          (p.status==="sold" ? ' · <strong style="color:var(--alert)">'+tr("status_sold")+'</strong>' : '')+'</div>'+
        '<div class="mdesc">'+escapeHtml(p.description)+'</div>'+
        '<div class="seller-box"><span class="avatar">'+initials(seller?seller.name:"?")+'</span>'+
          '<div><div style="font-weight:700; font-size:13.5px;">'+(seller?escapeHtml(seller.name):"—")+'</div>'+
          '<div style="font-size:12px; color:var(--muted);">'+tr("modal_member_since")+' '+(seller?new Date(seller.joinedAt).toLocaleDateString(currentLang):"—")+'</div></div></div>'+
        '<div class="contact-reveal" id="contactReveal">'+tr("contact_phone_label")+': '+(p.phone || (seller?seller.phone:"—"))+'</div>'+
        '<div class="actions">'+
          (isOwner ? '<span class="status-pill status-active">'+tr("modal_owner_badge")+'</span>' : '<button class="btn btn-gold" id="contactBtn">'+tr("modal_contact")+'</button>')+
        '</div>'+
      '</div>';
    document.getElementById("modalOverlay").classList.add("active");
    document.getElementById("modalClose").onclick=closeModal;
    var cbtn=document.getElementById("contactBtn");
    if(cbtn) cbtn.onclick=function(){
      if(!currentUser()){ closeModal(); openAuth("login"); toast(tr("toast_login_required_contact")); return; }
      document.getElementById("contactReveal").style.display="block";
    };
  }
  function closeModal(){ document.getElementById("modalOverlay").classList.remove("active"); }
  document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target.id==="modalOverlay") closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeModal(); closePay(); } });

  /* ================= selects ================= */
  function populateCategorySelect(){
    var sel=document.getElementById("s-category"); var prev=sel.value; sel.innerHTML="";
    CATEGORIES.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=CAT_EMOJI[c]+" "+tr("category_"+c); sel.appendChild(o); });
    if(prev) sel.value=prev;
  }
  function populateCitySelect(){
    var sel=document.getElementById("s-city"); var prev=sel.value; sel.innerHTML="";
    CITIES.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=tr("city_"+c); sel.appendChild(o); });
    if(prev) sel.value=prev;
  }
  function populateConditionSelect(){
    var sel=document.getElementById("s-condition"); var prev=sel.value; sel.innerHTML="";
    CONDITIONS.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=tr("condition_"+c); sel.appendChild(o); });
    if(prev) sel.value=prev;
  }

  /* ================= plan selection ================= */
  function selectPlan(id){ state.selectedPlan=id; renderPlanCards(); renderSellPreview(); }
  function renderPlanCards(){
    var grid=document.getElementById("planGrid"); if(!grid) return;
    grid.innerHTML="";

    var freeCard=document.createElement("div");
    freeCard.className="plancard"+(state.selectedPlan==="free"?" selected":"");
    freeCard.innerHTML =
      '<span class="pcheck"></span>'+
      '<div class="pname">'+tr("plan_free_name")+'</div>'+
      '<div class="pprice">SAR 0</div>'+
      '<div class="pdesc">'+tr("plan_free_desc")+'</div>';
    freeCard.onclick=function(){ selectPlan("free"); };
    grid.appendChild(freeCard);

    PREMIUM_PLANS.forEach(function(pl){
      var card=document.createElement("div");
      card.className="plancard premium"+(state.selectedPlan===pl.id?" selected":"");
      var desc=tr("plan_premium_desc_tpl").replace("{days}", pl.days);
      card.innerHTML =
        '<span class="pcheck"></span>'+
        '<div class="pname">'+tr("plan_premium_name")+'</div>'+
        '<div class="pprice">SAR '+pl.price+'</div>'+
        '<span class="ptag">'+pl.days+' '+tr("days_label")+'</span>'+
        '<div class="pdesc">'+desc+'</div>';
      card.onclick=function(){ selectPlan(pl.id); };
      grid.appendChild(card);
    });
  }
  renderPlanCards();

  /* ================= image upload ================= */
  function resizeImage(file, maxDim, cb){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.width, h=img.height; var scale=Math.min(1, maxDim/Math.max(w,h));
        var canvas=document.createElement("canvas"); canvas.width=Math.round(w*scale); canvas.height=Math.round(h*scale);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        cb(canvas.toDataURL("image/jpeg",0.82));
      };
      img.onerror=function(){cb(null);};
      img.src=e.target.result;
    };
    reader.onerror=function(){cb(null);};
    reader.readAsDataURL(file);
  }
  document.getElementById("s-image").addEventListener("change", function(e){
    var file=e.target.files[0]; if(!file) return;
    resizeImage(file, 640, function(dataUrl){
      state.imageDataUrl=dataUrl;
      document.getElementById("imgPickerText").innerHTML = dataUrl ? '<img src="'+dataUrl+'" alt="">' : tr("form_photo");
      renderSellPreview();
    });
  });

  function renderSellPreview(){
    var title=document.getElementById("s-title").value || tr("form_title");
    var price=document.getElementById("s-price").value || "0";
    var condition=document.getElementById("s-condition").value || CONDITIONS[0];
    var catId=document.getElementById("s-category").value || CATEGORIES[0];
    var cityId=document.getElementById("s-city").value || CITIES[0];
    var fake={title:title, price:price, category:catId, city:cityId, condition:condition, createdAt:Date.now(), status:"active", image:state.imageDataUrl, plan:state.selectedPlan};
    var holder=document.getElementById("previewCard"); holder.innerHTML="";
    var r=renderRow(fake); r.style.cursor="default"; r.onclick=null; holder.appendChild(r);
  }
  ["s-title","s-phone","s-price","s-condition","s-category","s-city"].forEach(function(id){
    document.getElementById(id).addEventListener("input", renderSellPreview);
    document.getElementById(id).addEventListener("change", renderSellPreview);
  });

  /* ================= payment simulation ================= */
  function openPay(amount, onConfirm){
    document.getElementById("payAmount").textContent = "SAR "+amount;
    document.getElementById("payOverlay").classList.add("active");
    document.getElementById("payConfirmBtn").onclick=function(){ closePay(); onConfirm(); };
    document.getElementById("payCancelBtn").onclick=closePay;
  }
  function closePay(){ document.getElementById("payOverlay").classList.remove("active"); }

  /* ================= sell form submit ================= */
  document.getElementById("sellForm").addEventListener("submit", function(e){
    e.preventDefault();
    var u=currentUser();
    if(!u){ openAuth("login"); toast(tr("toast_login_required_sell")); return; }
    var title=document.getElementById("s-title").value.trim();
    var phone=document.getElementById("s-phone").value.trim();
    var price=parseFloat(document.getElementById("s-price").value);
    var desc=document.getElementById("s-desc").value.trim();
    var errEl=document.getElementById("sellErr");
    if(!title || !phone || !desc || isNaN(price) || price<0){
      errEl.textContent = tr("register_error_fill"); errEl.style.display="block"; return;
    }
    errEl.style.display="none";

    function createListing(){
      var now=Date.now();
      var plan=state.selectedPlan;
      var expiresAt = now + planDays(plan)*86400000;
      var product={
        id:"p"+now, title:title, category:document.getElementById("s-category").value, city:document.getElementById("s-city").value,
        price:price, condition:document.getElementById("s-condition").value, description:desc, seller:u.username, phone:phone,
        createdAt:now, plan:plan, expiresAt:expiresAt, status:"active", image:state.imageDataUrl
      };
      var products=getProducts(); products.push(product);
      var ok=setProducts(products);
      if(!ok){ errEl.textContent="Couldn't save — try a smaller photo."; errEl.style.display="block"; return; }
      toast(tr("toast_published"));
      document.getElementById("sellForm").reset();
      state.imageDataUrl=null; state.selectedPlan="free"; renderPlanCards();
      document.getElementById("imgPickerText").textContent=tr("form_photo");
      populateCategorySelect(); populateCitySelect(); populateConditionSelect();
      renderGrid(); showView("home");
    }

    if(state.selectedPlan!=="free"){
      openPay(planPrice(state.selectedPlan), createListing);
    } else {
      createListing();
    }
  });

  /* ================= my listings ================= */
  function renderMyListings(){
    var u=currentUser(); var wrap=document.getElementById("myListWrap");
    if(!u){ wrap.innerHTML='<div class="empty"><div class="serif">'+tr("login_title")+'</div></div>'; return; }
    var mine=getProducts().filter(function(p){return p.seller===u.username;});
    mine.sort(function(a,b){return b.createdAt-a.createdAt;});
    if(!mine.length){
      wrap.innerHTML='<div class="empty"><div class="serif">'+tr("mylistings_empty_title")+'</div><div>'+tr("mylistings_empty_sub")+'</div></div>';
      return;
    }
    wrap.innerHTML="";
    mine.forEach(function(p){
      var st=computeStatus(p);
      var row=document.createElement("div"); row.className="mylist-item";
      var thumbStyle = p.image ? "" : "background:"+CAT_COLOR[p.category]+";";
      var statusHtml = '<span class="status-pill status-'+st+'">'+tr("status_"+st)+'</span>';
      row.innerHTML =
        '<div class="thumb-sm" style="'+thumbStyle+'">'+(p.image?'<img src="'+p.image+'" alt="">':CAT_EMOJI[p.category])+'</div>'+
        '<div class="mi-body"><div class="mi-title">'+escapeHtml(p.title)+statusHtml+'</div>'+
        '<div class="mi-meta">'+money(p.price)+' · '+tr("city_"+p.city)+' · '+timeAgo(p.createdAt)+(isPremium(p)?' · ★ '+tr("premium_badge"):'')+'</div></div>'+
        '<div class="mi-actions">'+
          (st!=="sold" ? '<button class="btn btn-ghost btn-sm toggleSold" style="padding:7px 12px; font-size:12.5px;">'+tr("btn_marksold")+'</button>' :
                          '<button class="btn btn-ghost btn-sm toggleSold" style="padding:7px 12px; font-size:12.5px;">'+tr("btn_markactive")+'</button>')+
          (st==="expired" ? '<button class="btn btn-ghost btn-sm renewBtn" style="padding:7px 12px; font-size:12.5px;">'+tr("btn_renew")+'</button>' : '')+
          (!isPremium(p) ? '<button class="btn btn-gold btn-sm upgradeBtn" style="padding:7px 12px; font-size:12.5px;">'+tr("btn_upgrade")+'</button>' : '')+
          '<button class="btn btn-danger delBtn" style="padding:7px 12px; font-size:12.5px;">'+tr("btn_delete")+'</button>'+
        '</div>';
      row.querySelector(".toggleSold").onclick=function(){
        var all=getProducts(); var idx=all.findIndex(function(x){return x.id===p.id;});
        if(idx>-1){ all[idx].status = all[idx].status==="sold" ? "active" : "sold"; setProducts(all); renderMyListings(); renderGrid(); toast(tr("toast_updated")); }
      };
      var renewBtn=row.querySelector(".renewBtn");
      if(renewBtn) renewBtn.onclick=function(){
        var all=getProducts(); var idx=all.findIndex(function(x){return x.id===p.id;});
        if(idx>-1){ all[idx].status="active"; all[idx].expiresAt=Date.now()+FREE_DAYS*86400000; all[idx].plan="free"; setProducts(all); renderMyListings(); renderGrid(); toast(tr("toast_updated")); }
      };
      var upBtn=row.querySelector(".upgradeBtn");
      if(upBtn) upBtn.onclick=function(){
        var tier=PREMIUM_PLANS[1]; // default upgrade offer: the 30-day premium tier
        openPay(tier.price, function(){
          var all=getProducts(); var idx=all.findIndex(function(x){return x.id===p.id;});
          if(idx>-1){ all[idx].plan=tier.id; all[idx].status="active"; all[idx].expiresAt=Date.now()+tier.days*86400000; setProducts(all); renderMyListings(); renderGrid(); toast(tr("toast_updated")); }
        });
      };
      row.querySelector(".delBtn").onclick=function(){
        if(!confirm("Delete this listing? This can't be undone.")) return;
        setProducts(getProducts().filter(function(x){return x.id!==p.id;}));
        renderMyListings(); renderGrid(); toast(tr("toast_deleted"));
      };
      wrap.appendChild(row);
    });
  }

  /* ================= auth ================= */
  function openAuth(mode){ showView("auth"); toggleAuthMode(mode||"login"); }
  function toggleAuthMode(mode){
    document.getElementById("loginForm").style.display = mode==="login"?"block":"none";
    document.getElementById("registerForm").style.display = mode==="register"?"block":"none";
    document.getElementById("loginErr").style.display="none";
    document.getElementById("regErr").style.display="none";
  }
  document.getElementById("toRegister").onclick=function(){toggleAuthMode("register");};
  document.getElementById("toLogin").onclick=function(){toggleAuthMode("login");};

  document.getElementById("loginSubmit").addEventListener("click", function(){
    var username=document.getElementById("li-username").value.trim();
    var password=document.getElementById("li-password").value;
    var errEl=document.getElementById("loginErr");
    var u=getUsers().find(function(x){return x.username.toLowerCase()===username.toLowerCase();});
    if(!u || u.password!==password){ errEl.textContent=tr("login_error"); errEl.style.display="block"; return; }
    setSession(u.username); renderAuthArea(); toast(tr("toast_welcome_back")+", "+u.name.split(" ")[0]+"!"); showView("home");
    document.getElementById("li-username").value=""; document.getElementById("li-password").value="";
  });

  document.getElementById("registerSubmit").addEventListener("click", function(){
    var name=document.getElementById("r-name").value.trim();
    var username=document.getElementById("r-username").value.trim();
    var phone=document.getElementById("r-phone").value.trim();
    var password=document.getElementById("r-password").value;
    var errEl=document.getElementById("regErr");
    if(!name || !username || !password){ errEl.textContent=tr("register_error_fill"); errEl.style.display="block"; return; }
    if(password.length<4){ errEl.textContent=tr("register_error_short"); errEl.style.display="block"; return; }
    var users=getUsers();
    if(users.some(function(u){return u.username.toLowerCase()===username.toLowerCase();})){ errEl.textContent=tr("register_error_taken"); errEl.style.display="block"; return; }
    errEl.style.display="none";
    users.push({username:username, password:password, name:name, phone:phone||"—", joinedAt:Date.now()});
    setUsers(users); setSession(username); renderAuthArea();
    toast(tr("toast_account_created")); showView("home");
    ["r-name","r-username","r-phone","r-password"].forEach(function(id){document.getElementById(id).value="";});
  });

  /* ================= global nav ================= */
  document.getElementById("logoBtn").onclick=function(){ showView("home"); };
  document.getElementById("sellBtn").onclick=function(){ requireAuthThen(function(){ showView("sell"); }); };
  document.getElementById("heroSellBtn").onclick=function(){ requireAuthThen(function(){ showView("sell"); }); };
  document.getElementById("heroBrowseBtn").onclick=function(){ document.getElementById("productFeed").scrollIntoView({behavior:"smooth", block:"start"}); };
  document.getElementById("searchInput").addEventListener("input", function(e){ state.query=e.target.value; showView("home"); renderGrid(); });
  document.getElementById("sortSel").addEventListener("change", function(e){ state.sort=e.target.value; renderGrid(); });
  document.getElementById("langSel").addEventListener("change", function(e){
    currentLang = e.target.value; try{ localStorage.setItem(LS_LANG, currentLang); }catch(err){}
    applyLang();
  });

  /* ================= init ================= */
  currentLang = safeGet(LS_LANG, null) || "en";
  populateCategorySelect(); populateCitySelect(); populateConditionSelect();
  applyLang();
})();
</script>
</body>
</html>
